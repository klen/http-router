name: tests

on:
  pull_request:
    branches: [master, develop]

  push:
    branches: [master, develop, feature/**]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "pypy-3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check http_router

      - name: Types
        if: matrix.python-version != 'pypy-3.12'
        run: uv run mypy

      - name: Test
        run: uv run pytest
